<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="start-screen" class="screen">
    <h1>Tic Tac Toe</h1>
    <p>Select Game Mode</p>
    <button onclick="startGame('pvp')">Player vs Player</button>
    <button onclick="startGame('pvc')">Player vs Computer</button>
  </div>
  <div id="name-input-screen" class="screen hidden">
    <h2>Enter Player Names</h2>
    <input type="text" id="playerX" placeholder="Player X Name" />
    <input type="text" id="playerO" placeholder="Player O Name" />
    <button onclick="submitNames()">Start Game</button>
  </div>
  <div id="game-screen" class="screen hidden">
    <h1>Tic Tac Toe</h1>
    <p id="turn">X's Turn</p>
    <p id="scores">
      <span id="scoreX">X: 0</span> | 
      <span id="scoreO">O: 0</span> | 
      Draws: <span id="draws">0</span>
    </p>
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
    <button id="restartBtn">Restart</button>
    <button id="viewLeaderboardBtn">View Leaderboard</button>
    <button onclick="location.reload()">Change Mode</button>
  </div>
  <div id="leaderboard-screen" class="screen hidden">
    <h2>🏆 Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Wins</th>
        </tr>
      </thead>
      <tbody id="leaderboard-table-body"></tbody>
    </table>
    <button id="backToGameBtn">Back to Game</button>
  </div>
  <audio id="clickSound" src="click.mp3"></audio>
  <audio id="winSound" src="win.mp3"></audio>
  <audio id="drawSound" src="draw.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
